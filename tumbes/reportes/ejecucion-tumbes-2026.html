<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Ejecución MP Tumbes 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: banda institucional azul con la entidad; debajo, tarjetas de lectura en una columna ancha (máx. 1180px) con pestañas por vista. */
:root{
  --bg:#f5f1e8; --card:#fffdf8; --ink:#1d2433; --muted:#5f6878; --line:#e3dccd; --soft:#efe8d9;
  --navy:#13294b; --navy-ink:#f3efe6; --navy-muted:#a9b6cb;
  --gold:#d7a03a; --gold-soft:#f6e6c4; --red:#b5322b; --red-soft:#f7dcd8; --amber:#c9781e; --amber-soft:#f8e5cc;
  --green:#3d8a57; --green-soft:#dcefe2; --slate:#9fb2c8; --bar-bg:#e9e3d6;
  --f-display:"Source Serif 4", Georgia, "Times New Roman", serif;
  --f-text:"IBM Plex Sans", "Segoe UI", Arial, sans-serif;
  --f-mono:"IBM Plex Mono", Consolas, "Courier New", monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141922; --card:#1c2330; --ink:#e8e4da; --muted:#a3abb9; --line:#2f3847; --soft:#232b39;
  --navy:#0d1d36; --navy-ink:#f3efe6; --navy-muted:#93a3bd;
  --gold:#e3b257; --gold-soft:#4a3a1c; --red:#e2645b; --red-soft:#4a2421; --amber:#e39a49; --amber-soft:#4a3218;
  --green:#6cc08a; --green-soft:#1f3b2a; --slate:#6f86a3; --bar-bg:#2a3343; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141922; --card:#1c2330; --ink:#e8e4da; --muted:#a3abb9; --line:#2f3847; --soft:#232b39;
  --navy:#0d1d36; --navy-ink:#f3efe6; --navy-muted:#93a3bd;
  --gold:#e3b257; --gold-soft:#4a3a1c; --red:#e2645b; --red-soft:#4a2421; --amber:#e39a49; --amber-soft:#4a3218;
  --green:#6cc08a; --green-soft:#1f3b2a; --slate:#6f86a3; --bar-bg:#2a3343; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-text);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.band{background:var(--navy);color:var(--navy-ink)}
header.band .wrap{padding-block:18px 0}
.eyebrow{font:500 11px/1.3 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--navy-muted)}
h1{font:700 clamp(24px,3.4vw,34px)/1.1 var(--f-display);margin:6px 0 6px;text-wrap:balance}
h1 .ue{font:500 12px var(--f-mono);background:var(--gold);color:#1d2433;padding:2px 7px;border-radius:3px;vertical-align:middle;margin-left:8px}
.datos{font:12px var(--f-mono);color:var(--navy-muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--gold);display:inline-block}
nav.tabs{display:flex;gap:4px;margin-top:16px;overflow-x:auto}
nav.tabs a{color:var(--navy-muted);text-decoration:none;font:500 13px var(--f-text);padding:9px 14px;border-radius:6px 6px 0 0;white-space:nowrap}
nav.tabs a[aria-current="page"]{background:var(--bg);color:var(--ink)}
nav.tabs a:focus-visible{outline:2px solid var(--gold)}
main .wrap{padding-block:18px 40px;display:grid;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:18px 20px;min-width:0}
h2{font:700 20px/1.25 var(--f-display);margin:0 0 4px;text-wrap:balance}
h3{font:600 14px/1.3 var(--f-text);margin:0 0 6px}
.sub{color:var(--muted);font-size:13px;margin:0 0 12px;max-width:80ch}
.mono{font-family:var(--f-mono)}
.num{font-variant-numeric:tabular-nums}
.lab{font:500 10.5px/1.3 var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.grid-hero{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,1fr);gap:16px}
@media (max-width:820px){.grid-hero{grid-template-columns:1fr}}
.hero-top{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.big{font:700 clamp(40px,6vw,56px)/1 var(--f-display)}
.pill{display:inline-flex;align-items:center;gap:6px;font:600 11.5px var(--f-text);padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.p-ok{background:var(--green-soft);color:var(--green)} .p-mod{background:var(--amber-soft);color:var(--amber)} .p-risk{background:var(--red-soft);color:var(--red)}
.p-crit{background:var(--red);color:#fff} .p-crit::before{background:#fff}
.track{position:relative;height:12px;background:var(--bar-bg);border-radius:6px;margin:16px 0 6px}
.track .fill{position:absolute;inset:0 auto 0 0;background:var(--navy);border-radius:6px}
:root[data-theme="dark"] .track .fill{background:var(--slate)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .track .fill{background:var(--slate)}}
.track .mark{position:absolute;top:-5px;bottom:-5px;width:3px;background:var(--gold);border-radius:2px}
.scale{display:flex;justify-content:space-between;font:11px var(--f-mono);color:var(--muted)}
.note{background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:8px 12px;font-size:13px;margin-top:12px}
.funnel{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
@media (max-width:980px){.funnel{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:560px){.funnel{grid-template-columns:repeat(2,minmax(0,1fr))}}
.fstep{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;min-width:0}
.fstep .v{font:700 20px var(--f-display);margin:4px 0}
.fstep p{margin:0;color:var(--muted);font-size:12px}
.stack{display:flex;height:30px;border-radius:5px;overflow:hidden;margin:12px 0 8px}
.stack div{display:flex;align-items:center;justify-content:center;font:600 11px var(--f-mono);color:#fff;min-width:0;overflow:hidden;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.tbl-wrap{overflow-x:auto;margin-top:10px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font:600 10.5px/1.3 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;text-align:left;color:var(--navy-ink);background:var(--navy);padding:8px 10px;white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
td.r,th.r{text-align:right} td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
tr.hl td{background:var(--gold-soft)}
tr.click{cursor:pointer} tr.click:hover td{background:var(--soft)}
.tag{display:inline-block;font:600 10.5px var(--f-text);padding:2px 7px;border-radius:999px;border:1px solid var(--line);background:var(--soft);color:var(--muted)}
.att{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;padding:12px 0;border-top:1px solid var(--line);align-items:start}
.att:first-of-type{border-top:0}
.att .n{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 13px var(--f-text);color:#fff}
.att .amt{text-align:right;font:700 17px var(--f-display);white-space:nowrap}
.att .amt small{display:block;font:11px var(--f-text);color:var(--muted)}
.minibar{position:relative;height:8px;background:var(--bar-bg);border-radius:4px;width:90px;display:inline-block;vertical-align:middle;margin-right:6px}
.minibar span{position:absolute;inset:0 auto 0 0;border-radius:4px}
.toggle{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.toggle button{border:0;background:transparent;color:var(--ink);font:500 12.5px var(--f-text);padding:6px 13px;cursor:pointer}
.toggle button[aria-pressed="true"]{background:var(--navy);color:var(--navy-ink)}
.ctrl{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center;background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin:10px 0;font-size:12px}
.ctrl label{display:flex;align-items:center;gap:8px}
button.btn{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:6px 12px;font:500 12.5px var(--f-text);cursor:pointer}
button.btn:hover{background:var(--soft)}
svg text{fill:var(--muted);font-family:var(--f-mono);font-size:11px}
.chart{width:100%;height:auto;display:block}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:640px){.two{grid-template-columns:1fr}}
.proj{border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.proj .big{font-size:38px}
.alert{background:var(--red-soft);color:var(--red);border-radius:6px;padding:9px 12px;font-size:13px;margin-top:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 11px;font:500 12px var(--f-text);cursor:pointer}
.chip.done{background:var(--gold-soft);border-color:var(--gold)}
.chip.cur{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.chip:disabled{opacity:.45;cursor:default}
.side{display:grid;grid-template-columns:minmax(0,2.4fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.side{grid-template-columns:1fr}}
.diag{border:2px solid var(--red);border-radius:8px;padding:14px;background:var(--card)}
.diag h3{font:700 17px var(--f-display);color:var(--red)}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:2px 0}
input[type=search],select{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:7px 10px;font:13px var(--f-text)}
.filters{display:grid;gap:8px}
.filters label{font-size:12px;color:var(--muted);display:grid;gap:3px}
.fgrp{font:600 10.5px var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-top:8px;border-top:1px solid var(--line);padding-top:8px}
.cbar{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,2fr) auto auto;gap:10px;align-items:center;padding:6px 0;font-size:13px;cursor:pointer}
.cbar .b{height:14px;background:var(--bar-bg);border-radius:3px;position:relative}
.cbar .b span{position:absolute;inset:0 auto 0 0;background:var(--navy);border-radius:3px}
.cbar.sel .b span{background:var(--gold)}
.agenda{background:var(--navy);color:var(--navy-ink);border-radius:8px;padding:18px 20px}
.agenda h2{color:var(--navy-ink)} .agenda .sub{color:var(--navy-muted)}
.agenda table td{border-bottom-color:rgba(255,255,255,.12);color:var(--navy-ink)}
.agenda table th{background:transparent;color:var(--navy-muted);border-bottom:1px solid rgba(255,255,255,.2)}
.sev{width:12px;height:12px;border-radius:50%;display:inline-block}
footer{color:var(--muted);font-size:12px}
details summary{cursor:pointer;font-weight:600;font-size:13px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
/* ---------- créditos y diagramación para celular ---------- */
a.volver{display:inline-block;margin-bottom:8px;font:500 12.5px var(--f-text);color:var(--navy-muted);text-decoration:none}
a.volver:hover{color:var(--navy-ink)} a.volver:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.creditos .wrap{padding-block:8px 36px}
.cred-card{background:#fff;border:1px solid #e3dccd;border-radius:10px;padding:18px 22px;display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:center;gap:18px 56px}
.cred-item{display:grid;justify-items:center;gap:8px;min-width:0}
.cred-item .lab{color:#5f6878}
.cred-item img{height:74px;width:auto;max-width:100%;display:block}
.cred-item:last-child img{height:74px}
main .wrap{grid-template-columns:minmax(0,1fr)}
.chart-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
@media (max-width:640px){
  body{font-size:15px}
  .cred-card{flex-direction:column;gap:18px;padding:16px}
  .cred-item img{height:56px}
  .cred-item:last-child img{height:62px}
  header.band .wrap{padding-block:14px 0}
  .datos{font-size:11px}
  nav.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:14px;padding-bottom:12px;overflow:visible}
  nav.tabs a{white-space:normal;text-align:center;border-radius:6px;background:rgba(255,255,255,.09);padding:10px 8px;line-height:1.25;display:flex;align-items:center;justify-content:center}
  nav.tabs a[aria-current="page"]{background:var(--gold);color:#1d2433}
  main .wrap{padding-block:14px 32px;gap:12px}
  .card,.agenda{padding:14px}
  h2{font-size:19px}
  .sub{font-size:13.5px}
  .chart-scroll svg.chart{min-width:0}
  svg.chart text{font-size:14px}
  .att{grid-template-columns:30px minmax(0,1fr)}
  .att .amt{grid-column:2;text-align:left;white-space:normal}
  .att .amt small{white-space:normal}
  .kv{font-size:14px}
  table.apila thead{display:none}
  table.apila,table.apila tbody,table.apila tr,table.apila td{display:block;width:100%}
  table.apila tr{border:1px solid var(--line);border-radius:8px;padding:6px 12px;margin-bottom:10px;background:var(--card)}
  table.apila td{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:6px 0;border:0;border-bottom:1px dashed var(--line);text-align:right!important;white-space:normal;background:transparent!important;font-size:14px}
  table.apila td:last-child{border-bottom:0}
  table.apila td{flex-wrap:wrap}
  table.apila td > .sub, table.apila td > div{flex-basis:100%;text-align:right}
  table.apila td:first-child > .sub, table.apila td:first-child > div{text-align:left}
  table.apila td::before{content:attr(data-l);font:500 10.5px/1.35 var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:left;flex:0 1 48%}
  table.apila td:first-child{display:block;text-align:left!important;font-weight:600;font-size:14.5px;border-bottom:1px solid var(--line);padding-bottom:8px}
  table.apila td:first-child::before{display:none}
  table.apila td.vacio{display:none}
  table.apila tr.hl,table.apila tr.tot{background:var(--gold-soft)}
  table.apila tr.cur{border-style:dashed}
  .agenda table.apila tr{background:transparent;border-color:rgba(255,255,255,.22)}
  .agenda table.apila td{border-bottom-color:rgba(255,255,255,.15)}
  .agenda table.apila td::before{color:var(--navy-muted)}
}
@media (max-width:900px){.side{grid-template-columns:minmax(0,1fr)!important}}
@media (max-width:640px){
  .filters{grid-template-columns:1fr 1fr;column-gap:10px}
  .filters .fgrp, .filters button, .filters h3{grid-column:1/-1}
  .cbar{grid-template-columns:minmax(0,1fr) auto;row-gap:4px}
  .cbar .b{grid-column:1/-1;grid-row:2}
  .cbar > :nth-child(3){grid-column:1;grid-row:3;font-size:12px;color:var(--muted)}
  .cbar > :nth-child(4){grid-column:2;grid-row:3}
  table.apila td.largo{display:block;text-align:left!important}
  table.apila td.largo::before{display:block;margin-bottom:3px}
}
@media print{.chart-scroll::after{display:none}}
</style></head><body>

<header class="band">
  <div class="wrap">
    <a class="volver" href="../index.html">← Portal</a>
    <div class="eyebrow" id="h-eyebrow"></div>
    <h1 id="h-title"></h1>
    <div class="datos"><span class="dot"></span><span id="h-datos"></span></div>

      <a href="#panel">Panel de ejecución</a>

      <a href="#estructura">Análisis por estructura</a>
      <a href="#avanzado">Análisis avanzado</a>

  </div>
</header>

<main>

  <div class="wrap" id="view-cuellos" hidden></div>
  <div class="wrap" id="view-estructura" hidden></div>
  <div class="wrap" id="view-avanzado" hidden></div>
</main>

<script id="comun">
// En celular las tablas de 4 columnas o más se leen como fichas (etiqueta: valor) y los gráficos se deslizan.
(function(){
  function etiquetas(t){ const th=t.tHead; if(!th) return null; const g=[];
    [...th.rows].forEach((tr,ri)=>{ g[ri]=g[ri]||[]; let c=0;
      [...tr.cells].forEach(cell=>{ while(g[ri][c]!==undefined) c++; const cs=cell.colSpan||1, rs=cell.rowSpan||1, tx=cell.textContent.replace(/\s+/g,' ').trim();
        for(let r=0;r<rs;r++){ g[ri+r]=g[ri+r]||[]; for(let k=0;k<cs;k++) g[ri+r][c+k]=tx; } c+=cs; }); });
    const n=Math.max(0,...g.map(r=>r.length)); const out=[];
    for(let c=0;c<n;c++){ const p=[]; g.forEach(r=>{ const v=r[c]; if(v&&p[p.length-1]!==v) p.push(v); }); out.push(p.join(' · ')); }
    return out; }
  function apilar(root){ if(!root) return;
    root.querySelectorAll('table').forEach(t=>{
      if(!t._lab){ t._lab=etiquetas(t)||[]; if(t._lab.length>=4) t.classList.add('apila'); }
      if(!t.classList.contains('apila')) return;
      [...t.tBodies].forEach(tb=>[...tb.rows].forEach(tr=>{ if(tr.dataset.ap) return; tr.dataset.ap=1; let c=0;
        [...tr.cells].forEach(td=>{ td.dataset.l=t._lab[c]||''; const tx=td.textContent.trim(); if(c>0&&(tx==='—'||tx==='')) td.classList.add('vacio'); if(c>0&&tx.length>38&&!td.querySelector('.minibar')) td.classList.add('largo'); c+=td.colSpan||1; }); })); });
    root.querySelectorAll('svg.chart').forEach(s=>{ if(s.parentElement.classList.contains('chart-scroll')) return;
      const w=document.createElement('div'); w.className='chart-scroll'; s.before(w); w.appendChild(s); }); }
  window.apilarTablas=apilar;
  const m=document.querySelector('main')||document.querySelector('article');
  let pend=false;
  new MutationObserver(()=>{ if(pend) return; pend=true; requestAnimationFrame(()=>{ pend=false; apilar(m); }); }).observe(m,{childList:true,subtree:true});
  apilar(m);
})();

const hastaMes = a => a.dm.slice(0, mesCorte).reduce((x,y)=>x+y,0);   // devengado a fin del último mes completo
function habitual(dim, k){
  if(!H || mB<0) return null;
  const src = dim ? (H[dim]||{})[k] : H.tot; if(!src) return null;
  const v = Object.values(src).filter(o=>o.pim>0); if(!v.length) return null;
  return {hasta: avg(v.map(o=>o.hasta/o.pim)), fin: avg(v.map(o=>o.fin/o.pim)), n: v.length};
}
const HY = H ? H.years.join(', ') : '';
const finMes = mB>=0 ? MESES[mB].toLowerCase() : '';

// Criterios analíticos configurables (no son límites oficiales).
// Con histórico disponible, el estado compara el devengado a fin del último mes completo con el
// promedio de los años anteriores a esa misma fecha; sin histórico, con la referencia lineal.
const TH = {ok:5, risk:15};
function estado(devPct, h, cur){
  // Bandas analíticas (no oficiales): ±3 pts = próximo; −3 a −15 = inferior; < −15 = muy inferior.
  if (h && cur!=null){
    const d = (cur - h.hasta)*100;
    if (d>3)   return {c:'p-ok', t:'Superior al histórico',s:0,base:'hist',gap:d};
    if (d>=-3) return {c:'p-ok', t:'Próximo al histórico (±3 pts)',s:0,base:'hist',gap:d};
    if (d>=-15) return {c:'p-mod',t:'Inferior al histórico',s:1,base:'hist',gap:d};
    return {c:'p-risk',t:'Muy inferior al histórico',s:2,base:'hist',gap:d};
  }
  const gap = (ESP - devPct)*100;
  if (gap< -TH.ok) return {c:'p-ok',t:'Por encima de la referencia lineal',s:0,base:'lin',gap:-gap};
  if (gap<=TH.ok) return {c:'p-ok',t:'Próximo a la referencia lineal',s:0,base:'lin',gap:-gap};
  if (gap<=TH.risk) return {c:'p-mod',t:'Debajo de la referencia lineal',s:1,base:'lin',gap:-gap};
  return {c:'p-risk',t:'Muy debajo de la referencia lineal',s:2,base:'lin',gap:-gap};
}
function alertaCadena(v, h, cur){
  const e = estado(ratio(v[DEV],v[PIM]), h, cur);
  return {c:e.c, t:e.t, gap:e.gap, base:e.base};
}

  for(let i=0;i<5;i++){ const d=s[i]-s[i+1]; if(d>best){best=d;bi=i;} }
  return {s, i:bi, drop:best};
}

// ---------- gráficos SVG ----------
function lineChart(real, esperado, labels, opts={}){
  const W=760,H=300,L=44,R=56,T=14,B=34, w=W-L-R, h=H-T-B, n=labels.length;
  const x=i=>L+ (n>1? i*w/(n-1):0), y=v=>T+h-(Math.min(1,Math.max(0,v)))*h;
  let g='';
  for(let p=0;p<=100;p+=20){ g+=`<line x1="${L}" x2="${L+w}" y1="${y(p/100)}" y2="${y(p/100)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${y(p/100)+4}" text-anchor="end">${p}%</text>`; }
  labels.forEach((t,i)=>{ g+=`<text x="${x(i)}" y="${H-12}" text-anchor="middle">${t}</text>`; });
  const pe = esperado.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
  const pr = real.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
  const area = `${pe} ${real.map((v,i)=>`${x(i)},${y(v)}`).reverse().join(' ')}`;
  const li=n-1;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.aria||'')}">${g}
   <polygon points="${area}" fill="var(--red)" fill-opacity=".10"/>
   <polyline points="${pe}" fill="none" stroke="var(--amber)" stroke-width="2" stroke-dasharray="5 4"/>
   <polyline points="${pr}" fill="none" stroke="var(--navy)" stroke-width="2.5"/>
   ${real.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="var(--navy)"/>`).join('')}
   <text x="${x(li)+6}" y="${y(esperado[li])+4}" style="fill:var(--amber);font-weight:600">${(esperado[li]*100).toFixed(1)}%</text>
   <text x="${x(li)+6}" y="${y(real[li])+4}" style="fill:var(--ink);font-weight:600">${(real[li]*100).toFixed(1)}%</text>
   <text x="${x(li)+6}" y="${y(real[li])+17}" style="fill:var(--red)">${pts(real[li]-esperado[li])} pt</text>
  </svg>`;
}
function barChart(vals, labels, avg, need, partialIdx){
  const W=760,H=300,L=58,R=48,T=14,B=34,w=W-L-R,h=H-T-B,n=vals.length;
  const max = Math.max(need, ...vals, avg)*1.08 || 1;
  const step = niceStep(max/5);
  const y=v=>T+h-v/max*h, bw=w/n*0.62;
  let g='';
  for(let v=0; v<=max; v+=step){ g+=`<line x1="${L}" x2="${L+w}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${(v/1e6).toFixed(0)} M</text>`; }
  vals.forEach((v,i)=>{ const cx=L+(i+.5)*w/n; const part=i===partialIdx;
    g+=`<rect x="${cx-bw/2}" y="${y(Math.max(v,0))}" width="${bw}" height="${Math.max(0,h-(y(Math.max(v,0))-T))}" rx="2" fill="${part?'var(--slate)':'var(--navy)'}" ${part?'fill-opacity=".55"':''}/>`;
    g+=`<text x="${cx}" y="${y(Math.max(v,0))-5}" text-anchor="middle" style="fill:var(--ink)">${(v/1e6).toFixed(1)}</text>`;
    g+=`<text x="${cx}" y="${H-12}" text-anchor="middle">${labels[i]}</text>`; });
  g+=`<line x1="${L}" x2="${L+w}" y1="${y(avg)}" y2="${y(avg)}" stroke="var(--muted)" stroke-dasharray="4 4"/><text x="${L+w+4}" y="${y(avg)+4}">${(avg/1e6).toFixed(1)}</text>`;
  g+=`<line x1="${L}" x2="${L+w}" y1="${y(need)}" y2="${y(need)}" stroke="var(--red)" stroke-dasharray="6 4"/><text x="${L+w+4}" y="${y(need)+4}" style="fill:var(--red);font-weight:600">${(need/1e6).toFixed(1)}</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Devengado mensual">${g}</svg>`;
}
function niceStep(x){ const p=Math.pow(10,Math.floor(Math.log10(x||1))); const f=x/p; return (f<1.5?1:f<3?2:f<7?5:10)*p; }

    </tbody></table></div>
    <p class="sub" style="margin-top:12px">Escenarios sin repunte de fin de año (solo con el ritmo de los meses previos):</p>`
    :`<p class="sub">Si nada cambia, el año cerraría entre ${P1(Math.min(ratio(proy(prom),tv[PIM]),ratio(proy(prom3),tv[PIM])))} y ${P1(Math.max(ratio(proy(prom),tv[PIM]),ratio(proy(prom3),tv[PIM])))} de ejecución. Estas proyecciones no consideran el repunte habitual de diciembre.</p>`}
    <div class="two">
      <div class="proj"><div class="lab">Al ritmo promedio del año (${M1(prom)}/mes)</div><div class="big num">${P1(ratio(proy(prom),tv[PIM]))}</div><div class="sub">${M1(proy(prom))} al 31/12 · <b style="color:var(--red)">saldo sin gastar: ${M1(tv[PIM]-proy(prom))}</b></div></div>
      <div class="proj"><div class="lab">Al ritmo de los últimos 3 meses (${M1(prom3)}/mes)</div><div class="big num">${P1(ratio(proy(prom3),tv[PIM]))}</div><div class="sub">${M1(proy(prom3))} al 31/12 · <b style="color:var(--red)">saldo sin gastar: ${M1(tv[PIM]-proy(prom3))}</b></div></div>
    </div>
    <div class="alert">Para devengar todo el PIM se necesitarían <b>${M1(necesario)} por mes</b> hasta el 31/12: ${(ratio(necesario,prom)).toFixed(1)} veces el promedio mensual del año. ${PH?'Ninguno de los escenarios basados en '+HY+' llega a devengar todo el PIM.':''}</div>
    <details style="margin-top:12px"><summary>¿Cómo se calcula?</summary>
      <p class="sub" style="margin-top:8px">Referencia lineal = días transcurridos ÷ días del año (${doy} ÷ ${diy}); supone gasto uniforme.${PH?` Factor de cierre de cada año anterior = devengado anual ÷ devengado a fin de ${finMes}; se aplica al devengado de este año a la misma fecha (${M1(base)}${PH.credDev?', sin operaciones de crédito':''}). El segundo método suma al mismo devengado el gasto que en años anteriores se hizo de ${MESES[mesCorte].toLowerCase()} a diciembre, como % del PIM. Ambos se limitan al PIM actual. Los porcentajes históricos usan el PIM final de cada año (comparación retrospectiva). Menor y mayor ejecución: el valor más bajo y el más alto entre los factores de cierre de cada año y el segundo método. El devengado parcial del mes en curso no se suma dos veces: los métodos históricos parten del devengado a fin de ${finMes}.${PH.credDev?` Las operaciones oficiales de crédito (rubro 19: CIPRL, bonos, préstamos) quedan fuera de ambos métodos, porque su devengado sigue el cronograma de la obra financiada y no el ritmo de gasto de la entidad: se suma a cada escenario el devengado ya registrado con ese rubro (${M1(PH.credDev)}) y no se proyecta el resto de su PIM.`:''}`:''} Proyección por ritmo = devengado actual + ritmo mensual × meses que faltan (${mesesRest.toFixed(2)}). El promedio usa los meses completos (enero a ${MESES[Math.max(0,mesCorte-1)].toLowerCase()}); el mes en curso es parcial y no entra en el promedio. Ritmo necesario = saldo por devengar ÷ meses que faltan.</p></details>
  </section>
  <footer>Reporte generado automáticamente con datos públicos del MEF. Montos en soles. Las áreas indicadas son responsables propuestos. Las brechas entre fases del gasto son señales para revisar, no causas comprobadas.</footer>`;
  renderConcentra();
}

let concDim='gen';
function renderConcentra(){
  const el=$('#concentra');
  const gInv = agg(F,'gen').find(g=>g.k==='2.6');
  const rows = agg(F,concDim).filter(r=>r.v[PIM]>0).map(r=>{const d=ratio(r.v[DEV],r.v[PIM]), c=ratio(r.v[CER],r.v[PIM]); const h=habitual(concDim,r.k), cur=H&&mB>=0?ratio(hastaMes(r),r.v[PIM]):null; return {...r,d,c,h,cur,e:estado(d,h,cur),atr:Math.max(0,ESP*r.v[PIM]-r.v[DEV])};}).sort((a,b)=>b.atr-a.atr);
  const head = gInv? `${esc(title(gInv.l))} certificó ${P1(ratio(gInv.v[CER],gInv.v[PIM]))} pero devengó ${P1(ratio(gInv.v[DEV],gInv.v[PIM]))}.` : '';
  el.innerHTML = `<h2>¿Dónde se concentra la brecha?</h2><p class="sub">${head} Brecha lineal = PIM × ${P1(ESP)} (tiempo transcurrido) menos lo devengado: es un orden de magnitud, no un monto que debía gastarse.</p>
   <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span class="lab">Ver por</span>
    <div class="toggle" role="group" aria-label="Agrupar por">${[['gen','Tipo de gasto'],['prog','Programa'],['fun','Función']].map(([k,t])=>`<button type="button" data-k="${k}" aria-pressed="${k===concDim}">${t}</button>`).join('')}</div></div>
   <div class="ctrl"><span class="lab">Criterio analítico configurable (no oficial), solo para filas sin histórico</span>
    <label for="th-ok">En línea si está dentro de <b id="th-ok-v">${TH.ok}</b> pts <input id="th-ok" type="range" min="0" max="20" value="${TH.ok}"></label>
    <label for="th-risk">Riesgo si está a más de <b id="th-risk-v">${TH.risk}</b> pts <input id="th-risk" type="range" min="5" max="40" value="${TH.risk}"></label>
    <button type="button" class="btn" id="th-reset">Restablecer</button></div>
   <div class="tbl-wrap"><table><thead><tr><th>${DIM[concDim].n}</th><th class="r">PIM</th><th>Certificado</th><th>Devengado</th><th class="r">Brecha lineal S/</th><th>Estado</th>${H?`<th class="r" style="white-space:normal;min-width:120px">Fin de ${finMes}: ${anio} / habitual</th>`:''}</tr></thead><tbody>
   ${rows.map(r=>`<tr><td>${esc(title(r.l))}</td><td class="r num">${M1(r.v[PIM])}</td>
     <td class="num"><span class="minibar"><span style="width:${Math.min(100,r.c*100)}%;background:var(--slate)"></span></span>${P1(r.c)} <span class="sub">(${pts(r.c-ESP)})</span></td>
     <td class="num"><span class="minibar"><span style="width:${Math.min(100,r.d*100)}%;background:var(--navy)"></span></span>${P1(r.d)} <span class="sub">(${pts(r.d-ESP)})</span></td>
     <td class="r num">${r.atr>0?M1(r.atr):'—'}</td><td><span class="pill ${r.e.c}">${r.e.t} (${pts(r.e.gap/100)})</span></td>${H?(()=>{const h=r.h; const cur=r.cur; return `<td class="r num">${P1(cur)} / ${h?P1(h.hasta):'—'}${h?` <span style="font-weight:600;color:${cur>=h.hasta-0.03?'var(--green)':'var(--red)'}">${pts(cur-h.hasta)}</span>`:''}</td>`;})():''}</tr>`).join('')}
   </tbody></table></div>
   <p class="sub" style="margin-top:8px;font-size:12px">Entre paréntesis, en las columnas de avance, la diferencia en puntos frente a la referencia lineal. El estado usa el histórico cuando existe (bandas analíticas: superior, más de 3 pts arriba; próximo, ±3 pts; inferior, de 3 a 15 pts abajo; muy inferior, más de 15) y, si no, la referencia lineal con los umbrales configurables (${TH.ok} y ${TH.risk} pts).${H?` La última columna compara el devengado a fin de ${finMes} con el promedio de ${HY} a la misma fecha (verde: superior o próximo al histórico, dentro de 3 pts por debajo; rojo: más de 3 pts por debajo; banda analítica, no oficial).`:''}</p>`;
  el.querySelectorAll('.toggle button').forEach(b=>b.onclick=()=>{concDim=b.dataset.k; renderConcentra();});
  const upd=()=>{TH.ok=+$('#th-ok').value; TH.risk=Math.max(TH.ok+1,+$('#th-risk').value); renderPanel(); document.getElementById('concentra').scrollIntoView({block:'nearest'});};
  $('#th-ok').onchange=upd; $('#th-risk').onchange=upd;
  $('#th-reset').onclick=()=>{TH.ok=5;TH.risk=15;renderPanel();};
}

const NIVELES=['fun','div','grp','prog','tipo','prod','act','meta','rubro','gen','espd'];
let path=[]; // [{dim,k,l}]
let selRow=null, q='';
function rowsPath(){ return F.filter(r=>path.every(p=>DIM[p.dim].k(r)===p.k)); }
function renderCuellos(){
  const lvl = NIVELES[path.length];
  const base = rowsPath();
  const el=$('#view-cuellos');
  if(!lvl){ path.pop(); return renderCuellos(); }
  let rows = agg(base,lvl).filter(r=>Math.abs(r.v[PIM])>0.5).sort((a,b)=>b.v[PIM]-a.v[PIM]);
  const all = rows;
  if(q) rows = rows.filter(r=>(r.l||'').toLowerCase().includes(q.toLowerCase()) || String(r.k).includes(q));
  const pick = selRow && all.find(r=>r.k===selRow) || all[0];
  const cz = pick? cuello(pick.v):null;
  el.innerHTML = `
  <section class="card">
    <h2>¿Dónde está el problema? Cuellos de botella y estructura</h2>
    <p class="sub">Los 11 niveles reales de la cadena presupuestal. Haga clic en una fila para ver su diagnóstico y en «Ver desglose» para bajar al siguiente nivel; los niveles recorridos (en dorado) permiten volver.</p>
    <input type="search" id="cq" placeholder="Buscar en esta lista…" value="${esc(q)}" aria-label="Buscar en la lista">
    <div class="chips">${NIVELES.map((d,i)=>`<button type="button" class="chip ${i<path.length?'done':i===path.length?'cur':''}" data-i="${i}" ${i>path.length?'disabled':''} title="${i<path.length?esc(path[i].l):''}">${i<path.length? esc(title(path[i].l).slice(0,38)) : DIM[d].n}</button>`).join('')}</div>
  </section>
  <div class="side">
    <section class="card">
      <h3>Ejecución por ${DIM[lvl].n.toLowerCase()}</h3>
      <p class="sub" style="font-size:12px">La alerta no depende solo del %: compara el punto exacto del embudo donde se frena cada cadena.</p>
      <div class="tbl-wrap"><table><thead><tr><th>Nombre</th><th class="r">PIM</th><th class="r">Cert.</th><th class="r">C. anual</th><th class="r">C. mens.</th><th class="r">Deveng.</th><th class="r">Girado</th><th>Alerta</th><th></th></tr></thead><tbody>
      ${rows.map(r=>{const a=alertaCadena(r.v), v=r.v; return `<tr class="click ${pick&&r.k===pick.k?'hl':''}" data-k="${esc(r.k)}"><td><b>${esc(title(r.l)||r.k)}</b></td><td class="r num">${M1(v[PIM])}</td><td class="r num">${P1(ratio(v[CER],v[PIM]))}</td><td class="r num">${P1(ratio(v[CA],v[PIM]))}</td><td class="r num">${P1(ratio(v[CM],v[PIM]))}</td><td class="r num">${P1(ratio(v[DEV],v[PIM]))}</td><td class="r num">${P1(ratio(v[GIR],v[PIM]))}</td><td><span class="pill ${a.c}">${a.t}</span></td><td>${path.length<NIVELES.length-1?`<button type="button" class="btn" data-down="${esc(r.k)}">Ver desglose →</button>`:''}</td></tr>`;}).join('')}
      </tbody></table></div>
      <p class="sub" style="margin-top:10px;font-size:12px">Datos de la unidad ejecutora en Datos Abiertos del MEF; el buscador, la selección y la navegación por los 11 niveles funcionan sobre esos datos.</p>
    </section>
    <aside>
      ${pick? `<div class="diag"><div class="lab">Diagnóstico automático · ${esc(title(pick.l)).slice(0,60)}</div>
        <h3 style="margin-top:6px">Cuello de botella en ${ETAPAS[cz.i+1]}</h3>
        ${['PIM','Certificación','Comp. anual','Comp. mensual','Devengado','Girado'].map((t,i)=>`<div class="kv"><span>${t}</span><b class="num">${i===0?M1(pick.v[PIM]):P1(cz.s[i])}</b></div>`).join('')}
        <p style="font-size:13px;margin:10px 0 0">El mayor freno está entre <b>${ETAPAS[cz.i]}</b> y <b>${ETAPAS[cz.i+1]}</b>: ${(cz.drop*100).toFixed(1)} puntos de caída en un solo tramo.</p>
        <p style="font-size:13px;margin:6px 0 0"><b>Sugerencia:</b> ${RESP[cz.i]}</p></div>`:''}
      <div class="card" style="margin-top:12px"><h3>Cómo se arma esta alerta</h3><p class="sub" style="margin:0;font-size:12.5px">Se recorre el embudo (PIM → Cert. → C. anual → C. mensual → Deveng. → Girado) en cada fila y se identifica el tramo con la caída más grande. El estado compara el devengado con la referencia lineal (${P1(ESP)}), con umbrales configurables de ${TH.ok} y ${TH.risk} pts; no son límites oficiales. El tramo de mayor caída es una señal para revisar, no la causa comprobada.</p></div>

  $('#cq').oninput=e=>{q=e.target.value; const pos=e.target.selectionStart; renderCuellos(); const i=$('#cq'); i.focus(); i.setSelectionRange(pos,pos);};

const FILTROS=[['Estructura funcional',['fun','div','grp','prog','prod','act','meta']],['Financiamiento',['fuente','rubro']],['Estructura económica',['cat','gen','sub','esp']]];
const FSEL={}; let genSel=null;
function renderEstructura(){
  const el=$('#view-estructura');
  const match=(r,skip)=>Object.entries(FSEL).every(([d,k])=>d===skip||!k||DIM[d].k(r)===k);
  const rows=F.filter(r=>match(r));
  const totF=agg(rows,null)[0]||{v:[0,0,0,0,0,0,0]};
  const opts=d=>{ const a=agg(F.filter(r=>match(r,d)),d).filter(x=>x.v[PIM]>0).sort((x,y)=>String(x.k).localeCompare(String(y.k))); return `<option value="">Todos</option>`+a.map(x=>`<option value="${esc(x.k)}" ${FSEL[d]===x.k?'selected':''}>${esc((d==='meta'?x.k+' · ':'')+title(x.l)).slice(0,70)}</option>`).join(''); };
  const gens=agg(rows,'gen').filter(g=>g.v[PIM]>0).sort((a,b)=>b.v[PIM]-a.v[PIM]);
  const maxG=Math.max(1,...gens.map(g=>g.v[PIM]));
  if(genSel && !gens.find(g=>g.k===genSel)) genSel=null;
  const gS = genSel || (gens[0]&&gens[0].k);
  const esp=agg(rows.filter(r=>DIM.gen.k(r)===gS),'espd').filter(e=>e.v[PIM]>0).sort((a,b)=>b.v[PIM]-a.v[PIM]);
  const act=Object.entries(FSEL).filter(([,k])=>k);
  el.innerHTML=`<section class="card"><h2>Análisis por estructura presupuestal</h2><p class="sub">Combine filtros de la cadena funcional, del financiamiento y de la estructura económica; la composición por genérica y las específicas se recalculan con su selección.</p></section>
  <div class="side" style="grid-template-columns:minmax(0,1fr) minmax(0,2.6fr)">
   <aside class="card"><h3>Filtros</h3><div class="filters">
    ${FILTROS.map(([g,ds])=>`<div class="fgrp">${g}</div>`+ds.map(d=>`<label for="f-${d}">${DIM[d].n}<select id="f-${d}" data-d="${d}">${opts(d)}</select></label>`).join('')).join('')}
    <button type="button" class="btn" id="f-clear" style="margin-top:10px">Limpiar filtros</button></div></aside>
   <div style="display:grid;gap:16px;min-width:0">
    <section class="card" style="background:var(--navy);color:var(--navy-ink);border-color:var(--navy)"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center">
      <div><span class="tag" style="background:rgba(255,255,255,.1);color:var(--navy-ink);border-color:rgba(255,255,255,.25)">${act.length? 'Filtro activo: '+act.map(([d,k])=>esc(title(agg(F.filter(r=>DIM[d].k(r)===k),d)[0]?.l||k)).slice(0,40)).join(' · ') : 'Sin filtros: toda la unidad ejecutora'}</span></div>
      <div style="display:flex;gap:24px"><div><div class="lab" style="color:var(--navy-muted)">PIM del filtro</div><div style="font:700 20px var(--f-display)">${M1(totF.v[PIM])}</div><div class="mono" style="font-size:11px;color:var(--navy-muted)">${P1(ratio(totF.v[PIM],tv[PIM]))} del total</div></div>
      <div><div class="lab" style="color:var(--navy-muted)">Devengado</div><div style="font:700 20px var(--f-display)">${M1(totF.v[DEV])}</div><div class="mono" style="font-size:11px;color:var(--navy-muted)">${P1(ratio(totF.v[DEV],totF.v[PIM]))}</div></div></div></div></section>
    <section class="card"><h2>¿En qué se está gastando? Composición por genérica</h2><p class="sub">Millones de PIM y % de ejecución (devengado/PIM) por genérica, según los filtros. Clic en una genérica para ver sus específicas.</p>
     ${gens.map(g=>`<div class="cbar ${g.k===gS?'sel':''}" data-g="${g.k}" role="button" tabindex="0"><div>${g.k} · ${esc(title(g.l))}</div><div class="b"><span style="width:${g.v[PIM]/maxG*100}%"></span></div><div class="num mono">${M1(g.v[PIM])} · ${P1(ratio(g.v[PIM],totF.v[PIM]))}</div><div class="num" style="font-weight:600;color:${estado(ratio(g.v[DEV],g.v[PIM])).s===2?'var(--red)':'var(--ink)'}">${P1(ratio(g.v[DEV],g.v[PIM]))} ej.</div></div>`).join('')||'<p class="sub">Sin datos para estos filtros.</p>'}
    </section>
    <section class="card"><h2>Específicas dentro de «${esc(title(N.cl[gS]||''))}»</h2><p class="sub">¿Cuáles concentran más presupuesto? ¿Cuáles tienen certificación alta pero devengado bajo? Brecha = puntos entre certificado y devengado; se marca desde 40 puntos.</p>
     <div class="tbl-wrap"><table><thead><tr><th>Específica de gasto</th><th class="r">PIM</th><th class="r">Cert. %</th><th class="r">Deveng. %</th><th class="r">Brecha</th></tr></thead><tbody>
     ${esp.map(e=>{const c=ratio(e.v[CER],e.v[PIM]),d=ratio(e.v[DEV],e.v[PIM]),b=(c-d)*100;return `<tr class="${b>=40?'hl':''}"><td>${esc(title(e.l))}<div class="mono sub" style="margin:0;font-size:11px">${e.k}</div></td><td class="r num">${M1(e.v[PIM])}</td><td class="r num">${P1(c)}</td><td class="r num">${P1(d)}</td><td class="r num">${b>=40?`<span class="pill p-risk">${b.toFixed(0)} pts</span>`:b.toFixed(0)+' pts'}</td></tr>`;}).join('')}
     </tbody></table></div></section>
   </div></div>`;
  el.querySelectorAll('select[data-d]').forEach(s=>s.onchange=()=>{FSEL[s.dataset.d]=s.value||undefined; renderEstructura();});
  $('#f-clear').onclick=()=>{for(const k in FSEL) delete FSEL[k]; genSel=null; renderEstructura();};
  el.querySelectorAll('.cbar').forEach(c=>{c.onclick=()=>{genSel=c.dataset.g; renderEstructura();}; c.onkeydown=e=>{if(e.key==='Enter'){genSel=c.dataset.g; renderEstructura();}};});
}

// ======================================================================
// VISTA 4: ANÁLISIS AVANZADO
// ======================================================================
function renderAvanzado(){
  const el=$('#view-avanzado');
  const gens=agg(F,'gen').filter(g=>g.v[PIM]||g.v[PIA]).sort((a,b)=>(b.v[PIM]-b.v[PIA])-(a.v[PIM]-a.v[PIA]));
  const inc = tv[PIM]-tv[PIA];
  const ejInc = v => { const i=v[PIM]-v[PIA]; return i>0? Math.max(0,v[DEV]-v[PIA])/i : null; };
  const progs=agg(F,'prog').filter(p=>p.v[PIM]>0).map(p=>({...p,inc:p.v[PIM]-p.v[PIA]}));
  const topInc=[...progs].sort((a,b)=>b.inc-a.inc).slice(0,2);
  const nuevos=progs.filter(p=>p.v[PIA]===0 && p.v[PIM]>0).sort((a,b)=>b.v[PIM]-a.v[PIM]).slice(0,2);
  const funs=agg(F,'fun').filter(f=>f.v[PIM]>0).sort((a,b)=>b.v[PIM]-a.v[PIM]);
  const metas=agg(F,'meta').map(m=>({...m, sc:m.v[PIM]-m.v[CER], csa:m.v[CER]-m.v[CA], cans:m.v[CA]-m.v[CM], pend:m.v[PIM]-m.v[DEV]})).sort((a,b)=>b.pend-a.pend).slice(0,5);
  const rubroPpal = (rows, fn) => { const m=new Map(); let t=0; rows.forEach(r=>{const v=fn(r); t+=v; m.set(r[2],(m.get(r[2])||0)+v);}); const best=[...m.entries()].sort((a,b)=>b[1]-a[1])[0]; return best&&t>0? {k:best[0], l:N.rubro[best[0]], sh:best[1]/t} : null; };
  const RUB_CORTO = {'00':'Recursos Ordinarios','07':'FONCOMUN','08':'Impuestos municipales','09':'Recursos directamente recaudados','13':'Donaciones y transferencias','18':'Canon y sobrecanon','19':'Endeudamiento (operaciones de crédito)'};
  const espd=agg(F,'espd').filter(e=>e.v[PIM]>0).map(e=>{ const rr=F.filter(r=>r[4]===e.k); const fs=[...new Set(rr.map(r=>title(DIM.fun.l(r))))]; const rp=rubroPpal(rr, r=>r[7]-r[8]); return {...e, saldo:e.v[CER]-e.v[CA], fs, rp}; }).sort((a,b)=>b.saldo-a.saldo);
  const proyRows=F.filter(r=>sfOf(r)[3]==='2');
  const proys=agg(proyRows,'prod').filter(p=>p.v[PIM]>0).map(p=>({...p,saldo:p.v[PIM]-p.v[DEV]})).sort((a,b)=>b.saldo-a.saldo);
  const pTot=agg(proyRows,null)[0]||{v:[0,0,0,0,0,0,0]};
  const pSaldo=pTot.v[PIM]-pTot.v[DEV];
  const progsT=[...progs].sort((a,b)=>b.v[PIM]-a.v[PIM]);
  // agenda
  const ag=[];
  const gTop=gens[0]; if(gTop && (gTop.v[PIM]-gTop.v[PIA])>0){
    const r19=F.filter(r=>DIM.gen.k(r)===gTop.k && r[2]==='19').reduce((a,r)=>a+r[6]-r[5],0);
    const acc = gTop.k==='2.6' ? 'Verificar contrato y cronograma de valorizaciones de las obras incorporadas al PIM.' : gTop.k==='2.1' ? 'Confirmar que las plazas o contratos que originaron el incremento ya se estén pagando.' : 'Confirmar que el gasto que originó el incremento ya se esté ejecutando.';
    ag.push({s:'var(--red)',p:`Incremento de ${esc(title(gTop.l))} aún no devengado`,m:(gTop.v[PIM]-gTop.v[PIA])-Math.max(0,gTop.v[DEV]-gTop.v[PIA]),r:RESP_GEN[gTop.k]||'Planeamiento',a: acc + (r19>0? ` ${M1(r19)} del incremento se financian con operaciones de crédito (CIPRL o bonos).`:'')}); }
  proys.forEach(p=>{ p.rp = rubroPpal(proyRows.filter(r=>DIM.prod.k(r)===p.k), r=>r[6]); });
  const pz=proys.find(p=>ratio(p.v[DEV],p.v[PIM])<0.05); if(pz){ const deuda = pz.rp && pz.rp.k==='19' && pz.rp.sh>0.5; ag.push({s:'var(--red)',p:`Proyecto ${esc(title(pz.l))} con saldo no devengado${deuda?' (financiado con operaciones de crédito)':''}`,m:pz.saldo,r:'Oficina de Proyectos de Inversión',a: deuda? `Certificado ${P1(ratio(pz.v[CER],pz.v[PIM]))} y devengado ${P1(ratio(pz.v[DEV],pz.v[PIM]))}: verificar el estado del convenio o contrato y el registro del ingreso de crédito.` : 'Revisar su situación (expediente, proceso, contrato): un avance financiero bajo no demuestra por sí solo que la obra no haya empezado.'}); }
  const pc=[...progs].sort((a,b)=>(b.v[CA]-b.v[CM])-(a.v[CA]-a.v[CM]))[0]; if(pc) ag.push({s:'var(--amber)',p:`Diferencia entre compromiso anual y mensual en ${esc(title(pc.l))}`,m:pc.v[CA]-pc.v[CM],r:'Presupuesto',a:'Revisar el calendario de compromisos de este programa; la diferencia no indica por sí sola atraso.'});
  const espSearch = (qq)=> espd.filter(e=>!qq|| (e.l||'').toLowerCase().includes(qq.toLowerCase())).slice(0,8);
  el.innerHTML=`<section class="card"><h2>Análisis avanzado y gestión</h2><p class="sub">Incremento del PIM, avance por función, programa presupuestal, metas con mayor saldo, certificación no comprometida, proyectos de inversión y agenda de intervención.</p></section>
  <section class="card"><h2>PIA → PIM: ¿el incremento ya se está ejecutando?</h2><p class="sub">Ejecución del incremento = (devengado − PIA) ÷ (PIM − PIA). Es una convención analítica: supone que primero se ejecuta el PIA. Los datos no indican cuándo se incorporó cada monto al PIM, así que no debe suponerse que el incremento estuvo disponible desde enero; y presupuesto incorporado no equivale a dinero recibido.</p>
   <div class="side" style="grid-template-columns:minmax(0,1fr) minmax(0,2.4fr)">
    <div class="diag" style="background:var(--red-soft)"><div class="lab">Incremento total del PIM</div><div class="big num" style="font-size:34px;color:var(--red)">${M1(inc)}</div><p style="margin:4px 0 0;font-size:13px"><b>${P1(ejInc(tv)||0)} del incremento ejecutado.</b> ${tv[DEV]<tv[PIA]?`El devengado total (${M1(tv[DEV])}) todavía no alcanza al PIA original (${M1(tv[PIA])}).`:''}</p></div>
    <div class="tbl-wrap" style="margin:0"><table><thead><tr><th>Genérica</th><th class="r">PIA</th><th class="r">PIM</th><th class="r">Incremento</th><th class="r">Ejecución del incremento</th></tr></thead><tbody>
     ${gens.map(g=>{const e=ejInc(g.v); return `<tr><td>${esc(title(g.l))}</td><td class="r num">${M1(g.v[PIA])}</td><td class="r num">${M1(g.v[PIM])}</td><td class="r num">${g.v[PIM]-g.v[PIA]>=0?'+':''}${M1(g.v[PIM]-g.v[PIA])}</td><td class="r">${e===null?'<span class="sub">sin incremento</span>':`<span class="pill ${e<0.05?'p-crit':e<0.5?'p-mod':'p-ok'}">${P1(e)}</span>`}</td></tr>`;}).join('')}
    </tbody></table></div></div>
   <p class="sub" style="margin-top:10px">Por programa, el mayor incremento está en ${topInc.map(p=>`<b>${esc(title(p.l))}</b> (+${M1(p.inc)})`).join(' y ')}.${nuevos.length?` Programas nuevos en el año (PIA S/ 0): ${nuevos.map(p=>`<b>${esc(title(p.l))}</b> (${M1(p.v[PIM])})`).join(', ')}.`:''}</p></section>

  <section class="card"><h2>Avance por función: histórico y referencia lineal</h2><p class="sub">Devengado ÷ PIM vigente. El color usa el histórico cuando existe (fin de ${finMes} frente al promedio de ${HY||'años anteriores'} a la misma fecha) y, si no, la referencia lineal (${P1(ESP)}). Criterios analíticos configurables, no oficiales.</p>
   <div class="tbl-wrap"><table><thead><tr><th>Función</th><th class="r">PIM</th><th class="r">Devengado</th><th class="r">Ref. lineal</th><th class="r">Fin de ${finMes}: actual / habitual</th><th>Situación</th></tr></thead><tbody>
   ${funs.map(f=>{const d=ratio(f.v[DEV],f.v[PIM]); const h=habitual('fun',f.k), cur=H&&mB>=0?ratio(hastaMes(f),f.v[PIM]):null; const e=estado(d,h,cur); const col=e.s===0?'var(--green)':e.s===1?'var(--gold)':'var(--red)'; return `<tr><td>${esc(title(f.l))}</td><td class="r num">${M1(f.v[PIM])}</td><td class="r num">${P1(d)}</td><td class="r num">${P1(ESP)} (${pts(d-ESP)})</td><td class="r num">${cur!=null?P1(cur):'—'} / ${h?P1(h.hasta):'—'}</td><td><span class="sev" style="background:${col}"></span> <span style="font-size:12px">${e.t} (${pts(e.gap/100)})</span></td></tr>`;}).join('')}
   </tbody></table></div></section>

  <section class="card"><h2>Ejecución por programa presupuestal</h2><p class="sub">Estado frente a la referencia lineal, con los umbrales configurables de «Cuellos de botella».</p>
   <div class="tbl-wrap"><table><thead><tr><th>Programa presupuestal</th><th class="r">PIM</th><th class="r">Cert.</th><th class="r">C. anual</th><th class="r">Comp.</th><th class="r">Deveng.</th><th>Alerta</th></tr></thead><tbody>
   ${progsT.map(p=>{const v=p.v,a=alertaCadena(v);return `<tr><td>${esc(title(p.l))}</td><td class="r num">${M1(v[PIM])}</td><td class="r num">${P1(ratio(v[CER],v[PIM]))}</td><td class="r num">${P1(ratio(v[CA],v[PIM]))}</td><td class="r num">${P1(ratio(v[CM],v[PIM]))}</td><td class="r num">${P1(ratio(v[DEV],v[PIM]))}</td><td><span class="pill ${a.c}">${a.t}</span></td></tr>`;}).join('')}
   </tbody></table></div></section>

  <section class="card"><h2>Metas con mayor saldo pendiente</h2><p class="sub">Las 5 metas con mayor monto por gastar (PIM − devengado), separado por la diferencia entre fases del gasto (señal para revisar, no causa).</p>
   <div class="tbl-wrap"><table><thead><tr><th>Meta</th><th class="r">PIM</th><th class="r">PIM − cert.</th><th class="r">Cert. − C.A.</th><th class="r">C.A. − C.M.</th><th class="r">Total pendiente</th></tr></thead><tbody>
   ${metas.map(m=>`<tr><td><b>${esc(title(m.l))}</b><div class="mono sub" style="margin:0;font-size:11px">Sec. func. ${m.k}</div></td><td class="r num">${M1(m.v[PIM])}</td><td class="r num">${M1(m.sc)}</td><td class="r num">${M1(m.csa)}</td><td class="r num">${M1(m.cans)}</td><td class="r num" style="color:var(--red);font-weight:700">${M1(m.pend)}</td></tr>`).join('')}
   </tbody></table></div></section>

  <section class="card"><h2>Certificación aún no comprometida, por específica de gasto</h2>
   <details open><summary>¿Por qué «Certificado − Comprometido anual»?</summary><p class="sub" style="margin-top:6px">La certificación reserva presupuesto para un gasto; el compromiso es lo que ya quedó atado a un contrato u orden. Lo certificado y todavía sin comprometer puede corresponder a órdenes por emitir, procesos en trámite u otros gastos: el dato agregado no muestra si existe contrato.</p></details>
   <input type="search" id="esp-q" placeholder="Buscar específica de gasto…" aria-label="Buscar específica de gasto" style="margin-top:10px">
   <div class="tbl-wrap"><table><thead><tr><th>Específica de gasto</th><th class="r">PIM</th><th class="r">Certificado</th><th class="r">Saldo</th><th>Cadena (función)</th></tr></thead><tbody id="esp-body"></tbody></table></div>
   <div class="note" id="esp-top"></div></section>

  <section class="card"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap"><h2>Proyectos de inversión: saldo por gastar</h2><b style="color:var(--red)">${M1(pSaldo)} no devengado (${P1(ratio(pSaldo,pTot.v[PIM]))} del PIM de ${proys.length} proyectos)</b></div>
   <p class="sub">Cartera de proyectos con CUI: PIM 2026 ${M1(pTot.v[PIM])}. Ordenados por saldo no devengado. El porcentaje es avance financiero del año (devengado ÷ PIM 2026), no avance físico, y el PIM anual no es el costo total del proyecto.</p>
   <div class="tbl-wrap"><table><thead><tr><th>Proyecto</th><th>Financiamiento principal</th><th class="r">PIM</th><th class="r">Cert.</th><th class="r">Deveng.</th><th class="r">Saldo</th></tr></thead><tbody>
   ${proys.slice(0,10).map(p=>{const d=ratio(p.v[DEV],p.v[PIM]);return `<tr><td><b>${esc(title(p.l))}</b><div class="mono sub" style="margin:0;font-size:11px">CUI ${p.k}</div></td><td style="font-size:12px;${p.rp&&p.rp.k==='19'?'color:var(--red);font-weight:600':''}">${p.rp?`${esc(RUB_CORTO[p.rp.k]||title(p.rp.l))} ${p.rp.sh<0.995?'('+P1(p.rp.sh)+')':''}`:'—'}</td><td class="r num">${M2(p.v[PIM])}</td><td class="r num">${P1(ratio(p.v[CER],p.v[PIM]))}</td><td class="r num" style="color:${d<0.05?'var(--red)':'inherit'};font-weight:${d<0.05?700:400}">${P1(d)}</td><td class="r num" style="color:var(--red)">${M2(p.saldo)}</td></tr>`;}).join('')}
   </tbody></table></div></section>

  <section class="agenda"><h2>Agenda de intervención gerencial</h2><p class="sub">Los montos vienen de los datos del MEF; el «responsable» es una propuesta del reporte, no una asignación institucional: validarlo con el organigrama. Cada problema es una señal para revisar, no una causa comprobada.</p>
   <div class="tbl-wrap"><table><thead><tr><th>Prior.</th><th>Problema</th><th class="r">Monto</th><th>Responsable</th><th>Acción sugerida</th></tr></thead><tbody>
   ${ag.map(a=>`<tr><td><span class="sev" style="background:${a.s}"></span></td><td><b>${a.p}</b></td><td class="r num" style="font-weight:700">${M1(a.m)}</td><td>${esc(a.r)}</td><td>${a.a}</td></tr>`).join('')}
   </tbody></table></div></section>`;
  const drawEsp=()=>{ const list=espSearch($('#esp-q').value); $('#esp-body').innerHTML=list.map((e,i)=>`<tr class="${i===0?'hl':''}"><td><b>${esc(title(e.l))}</b><div class="mono sub" style="margin:0;font-size:11px">${e.k}</div></td><td class="r num">${M2(e.v[PIM])}</td><td class="r num">${M2(e.v[CER])}</td><td class="r num" style="font-weight:700">${M2(e.saldo)}</td><td style="font-size:12px">${esc(e.fs.join(', '))}${e.rp&&e.rp.k==='19'&&e.rp.sh>0.5?`<div style="color:var(--red);font-weight:600">Operaciones de crédito (${P1(e.rp.sh)})</div>`:''}</td></tr>`).join('');
    const t=list[0]; $('#esp-top').innerHTML = t? `<span class="lab">Certificado sin comprometer</span> <b style="font:700 18px var(--f-display);margin:0 8px">${M2(t.saldo)}</b> ${esc(title(t.l))}: PIM ${M2(t.v[PIM])}, certificado ${M2(t.v[CER])}, comprometido ${M2(t.v[CA])}. Diferencia entre certificación y compromiso anual.${t.rp&&t.rp.k==='19'&&t.rp.sh>0.5?` <b style="color:var(--red)">${P1(t.rp.sh)} de este saldo se financia con operaciones de crédito (CIPRL o bonos), cuyo ingreso se registra conforme avanza el gasto.</b>`:''}`:'Sin resultados.'; };
  $('#esp-q').oninput=drawEsp; drawEsp();
}

// ---------- navegación por pestañas ----------
const VIEWS={panel:renderPanel,cuellos:renderCuellos,estructura:renderEstructura,avanzado:renderAvanzado};
const done={};
function show(){
  const v=(location.hash||'#panel').slice(1); const key=VIEWS[v]?v:'panel';
  for(const k in VIEWS){ $('#view-'+k).hidden = k!==key; }
  document.querySelectorAll('nav.tabs a').forEach(a=>a.setAttribute('aria-current', a.getAttribute('href')==='#'+key?'page':'false'));
  if(!done[key]){ VIEWS[key](); done[key]=1; }
}
window.addEventListener('hashchange',show); show();
})();
</script>
</body></html>
