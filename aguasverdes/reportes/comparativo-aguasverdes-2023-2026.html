<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Presupuesto MD Aguas Verdes 2023–2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

/* Layout: banda institucional azul con la entidad; debajo, tarjetas de lectura en una columna ancha (máx. 1180px) con pestañas por vista. */
:root{
  --bg:#f5f1e8; --card:#fffdf8; --ink:#1d2433; --muted:#5f6878; --line:#e3dccd; --soft:#efe8d9;
  --navy:#13294b; --navy-ink:#f3efe6; --navy-muted:#a9b6cb;
  --gold:#d7a03a; --gold-soft:#f6e6c4; --red:#b5322b; --red-soft:#f7dcd8; --amber:#c9781e; --amber-soft:#f8e5cc;
  --green:#3d8a57; --green-soft:#dcefe2; --slate:#9fb2c8; --bar-bg:#e9e3d6;
  --f-display:"Source Serif 4", Georgia, "Times New Roman", serif;
  --f-text:"IBM Plex Sans", "Segoe UI", Arial, sans-serif;
  --f-mono:"IBM Plex Mono", Consolas, "Courier New", monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141922; --card:#1c2330; --ink:#e8e4da; --muted:#a3abb9; --line:#2f3847; --soft:#232b39;
  --navy:#0d1d36; --navy-ink:#f3efe6; --navy-muted:#93a3bd;
  --gold:#e3b257; --gold-soft:#4a3a1c; --red:#e2645b; --red-soft:#4a2421; --amber:#e39a49; --amber-soft:#4a3218;
  --green:#6cc08a; --green-soft:#1f3b2a; --slate:#6f86a3; --bar-bg:#2a3343; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141922; --card:#1c2330; --ink:#e8e4da; --muted:#a3abb9; --line:#2f3847; --soft:#232b39;
  --navy:#0d1d36; --navy-ink:#f3efe6; --navy-muted:#93a3bd;
  --gold:#e3b257; --gold-soft:#4a3a1c; --red:#e2645b; --red-soft:#4a2421; --amber:#e39a49; --amber-soft:#4a3218;
  --green:#6cc08a; --green-soft:#1f3b2a; --slate:#6f86a3; --bar-bg:#2a3343; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-text);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.band{background:var(--navy);color:var(--navy-ink)}
header.band .wrap{padding-block:18px 0}
.eyebrow{font:500 11px/1.3 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--navy-muted)}
h1{font:700 clamp(24px,3.4vw,34px)/1.1 var(--f-display);margin:6px 0 6px;text-wrap:balance}
h1 .ue{font:500 12px var(--f-mono);background:var(--gold);color:#1d2433;padding:2px 7px;border-radius:3px;vertical-align:middle;margin-left:8px}
.datos{font:12px var(--f-mono);color:var(--navy-muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--gold);display:inline-block}
nav.tabs{display:flex;gap:4px;margin-top:16px;overflow-x:auto}
nav.tabs a{color:var(--navy-muted);text-decoration:none;font:500 13px var(--f-text);padding:9px 14px;border-radius:6px 6px 0 0;white-space:nowrap}
nav.tabs a[aria-current="page"]{background:var(--bg);color:var(--ink)}
nav.tabs a:focus-visible{outline:2px solid var(--gold)}
main .wrap{padding-block:18px 40px;display:grid;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:18px 20px;min-width:0}
h2{font:700 20px/1.25 var(--f-display);margin:0 0 4px;text-wrap:balance}
h3{font:600 14px/1.3 var(--f-text);margin:0 0 6px}
.sub{color:var(--muted);font-size:13px;margin:0 0 12px;max-width:80ch}
.mono{font-family:var(--f-mono)}
.num{font-variant-numeric:tabular-nums}
.lab{font:500 10.5px/1.3 var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.grid-hero{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,1fr);gap:16px}
@media (max-width:820px){.grid-hero{grid-template-columns:1fr}}
.hero-top{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.big{font:700 clamp(40px,6vw,56px)/1 var(--f-display)}
.pill{display:inline-flex;align-items:center;gap:6px;font:600 11.5px var(--f-text);padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.p-ok{background:var(--green-soft);color:var(--green)} .p-mod{background:var(--amber-soft);color:var(--amber)} .p-risk{background:var(--red-soft);color:var(--red)}
.p-crit{background:var(--red);color:#fff} .p-crit::before{background:#fff}
.track{position:relative;height:12px;background:var(--bar-bg);border-radius:6px;margin:16px 0 6px}
.track .fill{position:absolute;inset:0 auto 0 0;background:var(--navy);border-radius:6px}
:root[data-theme="dark"] .track .fill{background:var(--slate)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .track .fill{background:var(--slate)}}
.track .mark{position:absolute;top:-5px;bottom:-5px;width:3px;background:var(--gold);border-radius:2px}
.scale{display:flex;justify-content:space-between;font:11px var(--f-mono);color:var(--muted)}
.note{background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:8px 12px;font-size:13px;margin-top:12px}
.funnel{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
@media (max-width:980px){.funnel{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:560px){.funnel{grid-template-columns:repeat(2,minmax(0,1fr))}}
.fstep{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;min-width:0}
.fstep .v{font:700 20px var(--f-display);margin:4px 0}
.fstep p{margin:0;color:var(--muted);font-size:12px}
.stack{display:flex;height:30px;border-radius:5px;overflow:hidden;margin:12px 0 8px}
.stack div{display:flex;align-items:center;justify-content:center;font:600 11px var(--f-mono);color:#fff;min-width:0;overflow:hidden;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.tbl-wrap{overflow-x:auto;margin-top:10px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font:600 10.5px/1.3 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;text-align:left;color:var(--navy-ink);background:var(--navy);padding:8px 10px;white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
td.r,th.r{text-align:right} td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
tr.hl td{background:var(--gold-soft)}
tr.click{cursor:pointer} tr.click:hover td{background:var(--soft)}
.tag{display:inline-block;font:600 10.5px var(--f-text);padding:2px 7px;border-radius:999px;border:1px solid var(--line);background:var(--soft);color:var(--muted)}
.att{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;padding:12px 0;border-top:1px solid var(--line);align-items:start}
.att:first-of-type{border-top:0}
.att .n{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 13px var(--f-text);color:#fff}
.att .amt{text-align:right;font:700 17px var(--f-display);white-space:nowrap}
.att .amt small{display:block;font:11px var(--f-text);color:var(--muted)}
.minibar{position:relative;height:8px;background:var(--bar-bg);border-radius:4px;width:90px;display:inline-block;vertical-align:middle;margin-right:6px}
.minibar span{position:absolute;inset:0 auto 0 0;border-radius:4px}
.toggle{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.toggle button{border:0;background:transparent;color:var(--ink);font:500 12.5px var(--f-text);padding:6px 13px;cursor:pointer}
.toggle button[aria-pressed="true"]{background:var(--navy);color:var(--navy-ink)}
.ctrl{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center;background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin:10px 0;font-size:12px}
.ctrl label{display:flex;align-items:center;gap:8px}
button.btn{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:6px 12px;font:500 12.5px var(--f-text);cursor:pointer}
button.btn:hover{background:var(--soft)}
svg text{fill:var(--muted);font-family:var(--f-mono);font-size:11px}
.chart{width:100%;height:auto;display:block}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:640px){.two{grid-template-columns:1fr}}
.proj{border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.proj .big{font-size:38px}
.alert{background:var(--red-soft);color:var(--red);border-radius:6px;padding:9px 12px;font-size:13px;margin-top:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 11px;font:500 12px var(--f-text);cursor:pointer}
.chip.done{background:var(--gold-soft);border-color:var(--gold)}
.chip.cur{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.chip:disabled{opacity:.45;cursor:default}
.side{display:grid;grid-template-columns:minmax(0,2.4fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.side{grid-template-columns:1fr}}
.diag{border:2px solid var(--red);border-radius:8px;padding:14px;background:var(--card)}
.diag h3{font:700 17px var(--f-display);color:var(--red)}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:2px 0}
input[type=search],select{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:7px 10px;font:13px var(--f-text)}
.filters{display:grid;gap:8px}
.filters label{font-size:12px;color:var(--muted);display:grid;gap:3px}
.fgrp{font:600 10.5px var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-top:8px;border-top:1px solid var(--line);padding-top:8px}
.cbar{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,2fr) auto auto;gap:10px;align-items:center;padding:6px 0;font-size:13px;cursor:pointer}
.cbar .b{height:14px;background:var(--bar-bg);border-radius:3px;position:relative}
.cbar .b span{position:absolute;inset:0 auto 0 0;background:var(--navy);border-radius:3px}
.cbar.sel .b span{background:var(--gold)}
.agenda{background:var(--navy);color:var(--navy-ink);border-radius:8px;padding:18px 20px}
.agenda h2{color:var(--navy-ink)} .agenda .sub{color:var(--navy-muted)}
.agenda table td{border-bottom-color:rgba(255,255,255,.12);color:var(--navy-ink)}
.agenda table th{background:transparent;color:var(--navy-muted);border-bottom:1px solid rgba(255,255,255,.2)}
.sev{width:12px;height:12px;border-radius:50%;display:inline-block}
footer{color:var(--muted);font-size:12px}
details summary{cursor:pointer;font-weight:600;font-size:13px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
/* ---------- créditos y diagramación para celular ---------- */
a.volver{display:inline-block;margin-bottom:8px;font:500 12.5px var(--f-text);color:var(--navy-muted);text-decoration:none}
a.volver:hover{color:var(--navy-ink)} a.volver:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.creditos .wrap{padding-block:8px 36px}
.cred-card{background:#fff;border:1px solid #e3dccd;border-radius:10px;padding:18px 22px;display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:center;gap:18px 56px}
.cred-item{display:grid;justify-items:center;gap:8px;min-width:0}
.cred-item .lab{color:#5f6878}
.cred-item img{height:74px;width:auto;max-width:100%;display:block}
.cred-item:last-child img{height:74px}
main .wrap{grid-template-columns:minmax(0,1fr)}
.chart-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
@media (max-width:640px){
  body{font-size:15px}
  .cred-card{flex-direction:column;gap:18px;padding:16px}
  .cred-item img{height:56px}
  .cred-item:last-child img{height:62px}
  header.band .wrap{padding-block:14px 0}
  .datos{font-size:11px}
  nav.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:14px;padding-bottom:12px;overflow:visible}
  nav.tabs a{white-space:normal;text-align:center;border-radius:6px;background:rgba(255,255,255,.09);padding:10px 8px;line-height:1.25;display:flex;align-items:center;justify-content:center}
  nav.tabs a[aria-current="page"]{background:var(--gold);color:#1d2433}
  main .wrap{padding-block:14px 32px;gap:12px}
  .card,.agenda{padding:14px}
  h2{font-size:19px}
  .sub{font-size:13.5px}
  .chart-scroll svg.chart{min-width:0}
  svg.chart text{font-size:14px}
  .att{grid-template-columns:30px minmax(0,1fr)}
  .att .amt{grid-column:2;text-align:left;white-space:normal}
  .att .amt small{white-space:normal}
  .kv{font-size:14px}
  table.apila thead{display:none}
  table.apila,table.apila tbody,table.apila tr,table.apila td{display:block;width:100%}
  table.apila tr{border:1px solid var(--line);border-radius:8px;padding:6px 12px;margin-bottom:10px;background:var(--card)}
  table.apila td{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:6px 0;border:0;border-bottom:1px dashed var(--line);text-align:right!important;white-space:normal;background:transparent!important;font-size:14px}
  table.apila td:last-child{border-bottom:0}
  table.apila td{flex-wrap:wrap}
  table.apila td > .sub, table.apila td > div{flex-basis:100%;text-align:right}
  table.apila td:first-child > .sub, table.apila td:first-child > div{text-align:left}
  table.apila td::before{content:attr(data-l);font:500 10.5px/1.35 var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:left;flex:0 1 48%}
  table.apila td:first-child{display:block;text-align:left!important;font-weight:600;font-size:14.5px;border-bottom:1px solid var(--line);padding-bottom:8px}
  table.apila td:first-child::before{display:none}
  table.apila td.vacio{display:none}
  table.apila tr.hl,table.apila tr.tot{background:var(--gold-soft)}
  table.apila tr.cur{border-style:dashed}
  .agenda table.apila tr{background:transparent;border-color:rgba(255,255,255,.22)}
  .agenda table.apila td{border-bottom-color:rgba(255,255,255,.15)}
  .agenda table.apila td::before{color:var(--navy-muted)}
}
@media (max-width:900px){.side{grid-template-columns:minmax(0,1fr)!important}}
@media (max-width:640px){
  .filters{grid-template-columns:1fr 1fr;column-gap:10px}
  .filters .fgrp, .filters button, .filters h3{grid-column:1/-1}
  .cbar{grid-template-columns:minmax(0,1fr) auto;row-gap:4px}
  .cbar .b{grid-column:1/-1;grid-row:2}
  .cbar > :nth-child(3){grid-column:1;grid-row:3;font-size:12px;color:var(--muted)}
  .cbar > :nth-child(4){grid-column:2;grid-row:3}
  table.apila td.largo{display:block;text-align:left!important}
  table.apila td.largo::before{display:block;margin-bottom:3px}
}
@media print{.chart-scroll::after{display:none}}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.kpis{grid-template-columns:1fr}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px;min-width:0}
.kpi .v{font:700 26px/1.1 var(--f-display);margin:6px 0 4px}
.kpi p{margin:0;color:var(--muted);font-size:12.5px}
.kpi.warn{border-color:var(--red);border-width:2px}
.yr{font:600 11px var(--f-mono);padding:1px 6px;border-radius:3px;background:var(--soft);border:1px solid var(--line)}
td.heat{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
th.grp{text-align:center;border-left:1px solid rgba(255,255,255,.25)}
td.bl{border-left:1px solid var(--line)}
.cur td{font-style:italic}
tr.tot td{font-weight:700;background:var(--soft)}
.legend-y i{border-radius:50%}
th{white-space:normal;vertical-align:bottom}
</style></head><body>

<header class="band">
  <div class="wrap">
    <a class="volver" href="../index.html">← Portal</a>
    <div class="eyebrow" id="h-eyebrow"></div>
    <h1 id="h-title"></h1>
    <div class="datos"><span class="dot"></span><span id="h-datos"></span></div>
    <nav class="tabs" aria-label="Vistas del reporte">
      <a href="#evolucion">Evolución y proyección</a>
      <a href="#financiamiento">Financiamiento, saldos y deuda</a>
      <a href="#gasto">En qué se gasta</a>
      <a href="#inversiones">Inversiones</a>
    </nav>
  </div>
</header>
<main>
  <div class="wrap" id="view-evolucion"></div>
  <div class="wrap" id="view-financiamiento" hidden></div>
  <div class="wrap" id="view-gasto" hidden></div>
  <div class="wrap" id="view-inversiones" hidden></div>
</main>

<script id="comun">
// En celular las tablas de 4 columnas o más se leen como fichas (etiqueta: valor) y los gráficos se deslizan.
(function(){
  function etiquetas(t){ const th=t.tHead; if(!th) return null; const g=[];
    [...th.rows].forEach((tr,ri)=>{ g[ri]=g[ri]||[]; let c=0;
      [...tr.cells].forEach(cell=>{ while(g[ri][c]!==undefined) c++; const cs=cell.colSpan||1, rs=cell.rowSpan||1, tx=cell.textContent.replace(/\s+/g,' ').trim();
        for(let r=0;r<rs;r++){ g[ri+r]=g[ri+r]||[]; for(let k=0;k<cs;k++) g[ri+r][c+k]=tx; } c+=cs; }); });
    const n=Math.max(0,...g.map(r=>r.length)); const out=[];
    for(let c=0;c<n;c++){ const p=[]; g.forEach(r=>{ const v=r[c]; if(v&&p[p.length-1]!==v) p.push(v); }); out.push(p.join(' · ')); }
    return out; }
  function apilar(root){ if(!root) return;
    root.querySelectorAll('table').forEach(t=>{
      if(!t._lab){ t._lab=etiquetas(t)||[]; if(t._lab.length>=4) t.classList.add('apila'); }
      if(!t.classList.contains('apila')) return;
      [...t.tBodies].forEach(tb=>[...tb.rows].forEach(tr=>{ if(tr.dataset.ap) return; tr.dataset.ap=1; let c=0;
        [...tr.cells].forEach(td=>{ td.dataset.l=t._lab[c]||''; const tx=td.textContent.trim(); if(c>0&&(tx==='—'||tx==='')) td.classList.add('vacio'); if(c>0&&tx.length>38&&!td.querySelector('.minibar')) td.classList.add('largo'); c+=td.colSpan||1; }); })); });
    root.querySelectorAll('svg.chart').forEach(s=>{ if(s.parentElement.classList.contains('chart-scroll')) return;
      const w=document.createElement('div'); w.className='chart-scroll'; s.before(w); w.appendChild(s); }); }
  window.apilarTablas=apilar;
  const m=document.querySelector('main')||document.querySelector('article');
  let pend=false;
  new MutationObserver(()=>{ if(pend) return; pend=true; requestAnimationFrame(()=>{ pend=false; apilar(m); }); }).observe(m,{childList:true,subtree:true});
  apilar(m);
})();

<script>
(() => {
"use strict";
const D = JSON.parse(document.getElementById('datos').textContent);
const META = D.meta, YEARS = D.years.map(Number), CUR = Number(META.anio_actual);
const CLOSED = YEARS.filter(y=>y<CUR);
const PIA=0,PIM=1,CER=2,CA=3,CM=4,DEV=5,GIR=6;
const MESES=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Set','Oct','Nov','Dic'];
const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const YCOL={}; const PALY=['var(--slate)','var(--gold)','var(--green)','var(--navy)','var(--amber)','var(--red)'];
YEARS.forEach((y,i)=>YCOL[y]= y===CUR?'var(--red)':PALY[i%PALY.length]);

const corte=new Date(META.corte.length===10? META.corte+'T23:59' : META.corte), diy=((CUR%4===0&&CUR%100!==0)||CUR%400===0)?366:365;
const doy=Math.floor((corte-new Date(CUR,0,1))/864e5)+1, ESP=doy/diy, mesCorte=corte.getMonth();
const diasRest=Math.max(1,(new Date(CUR,11,31,23,59)-corte)/864e5), mesesRest=diasRest/30.4375;

const $=(s,el=document)=>el.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const M1=v=>'S/ '+(v/1e6).toFixed(1)+' M', M2=v=>'S/ '+(v/1e6).toFixed(2)+' M';
const P1=v=>(isFinite(v)?(v*100).toFixed(1):'0.0')+' %';
const pts=v=>(v>=0?'+':'')+(v*100).toFixed(1);
const ratio=(a,b)=>b?a/b:0;
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const MENORES=new Set(['de','del','la','las','los','el','y','e','o','u','a','al','en','por','para','con','sin','que','su','sus']);
const title=s=>String(s||'').toLowerCase().replace(/(^|[\s(\/-])([a-záéíóúñü]+)/g,(m,a,w,off)=>a+(off>0&&MENORES.has(w)?w:w.charAt(0).toUpperCase()+w.slice(1)));
const ylab=y=>y===CUR?`${y}*`:String(y);

// ---------- acceso a hechos ----------
const G=D.g, I=D.i;
const sfOf=(y,r)=>G[y].sf[r[0]];
const DIM={
  rubro:{n:'Rubro',k:(y,r)=>r[2],l:(y,r)=>G[y].names.rubro[r[2]]},
  fuente:{n:'Fuente',k:(y,r)=>r[1],l:(y,r)=>G[y].names.fuente[r[1]]},
  gen:{n:'Genérica',k:(y,r)=>r[4].split('.').slice(0,2).join('.'),l:(y,r)=>G[y].names.cl[r[4].split('.').slice(0,2).join('.')]},
  fun:{n:'Función',k:(y,r)=>sfOf(y,r)[9],l:(y,r)=>sfOf(y,r)[10]},
  prog:{n:'Programa',k:(y,r)=>sfOf(y,r)[1],l:(y,r)=>sfOf(y,r)[2]},
  prod:{n:'Producto/Proyecto',k:(y,r)=>sfOf(y,r)[5],l:(y,r)=>sfOf(y,r)[6]},
  tipo:{n:'Tipo',k:(y,r)=>sfOf(y,r)[3],l:(y,r)=>sfOf(y,r)[4]},
};
function agg(y, dim, filt){
  const m=new Map();
  for(const r of G[y].f){ if(filt&&!filt(r,y)) continue;
    const k=dim?DIM[dim].k(y,r):'*'; let a=m.get(k);
    if(!a){a={k,l:dim?DIM[dim].l(y,r):'Total',v:[0,0,0,0,0,0,0],dm:new Array(12).fill(0)};m.set(k,a);}
    for(let i=0;i<7;i++)a.v[i]+=r[5+i]; for(let i=0;i<12;i++)a.dm[i]+=r[12][i]; }
  return m;
}
const T={}; YEARS.forEach(y=>{T[y]=agg(y,null).get('*')||{v:[0,0,0,0,0,0,0],dm:new Array(12).fill(0)};});
function aggI(y, keyfn, filt){ const m=new Map(); if(!I[y]) return m;
  for(const r of I[y].f){ if(filt&&!filt(r)) continue; const k=keyfn?keyfn(r):'*'; let a=m.get(k); if(!a){a={k,pia:0,pim:0,rec:0};m.set(k,a);} a.pia+=r[3];a.pim+=r[4];a.rec+=r[5]; }
  return m; }
const hasI=YEARS.some(y=>I[y]);

// ---------- cabecera ----------
const fechaTxt=`${DIAS[corte.getDay()]} ${String(corte.getDate()).padStart(2,'0')}/${String(mesCorte+1).padStart(2,'0')}/${CUR}`;
$('#h-eyebrow').textContent=`Comportamiento presupuestal ${YEARS[0]}–${CUR} · Unidad ejecutora ${META.sec_ejec||''}`;
$('#h-title').innerHTML=`${esc(META.entidad)}<span class="ue">UE ${esc(META.sec_ejec||'')}</span>`;
const pubTxt = META.publicado ? (()=>{const d=new Date(META.publicado); return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')} h`;})() : '';
$('#h-datos').innerHTML=`Años cerrados: ${CLOSED.join(', ')} · ${CUR}* con datos al <b>${fechaTxt}</b>${pubTxt?` (archivo del MEF publicado el ${pubTxt})`:''} · Fuente: ${esc(META.fuente)}`;

// ---------- gráficos ----------
function niceStep(x){const p=Math.pow(10,Math.floor(Math.log10(x||1)));const f=x/p;return(f<1.5?1:f<3?2:f<7?5:10)*p;}
function groupedBars(groups, series, opts={}){ // groups: labels; series: [{n,col,vals}]
  const W=760,H=320,L=58,R=20,T0=16,B=40,w=W-L-R,h=H-T0-B;
  const max=Math.max(...series.flatMap(s=>s.vals))*1.12||1, step=niceStep(max/5), y=v=>T0+h-v/max*h;
  const gw=w/groups.length, bw=gw*0.72/series.length;
  let g='';
  for(let v=0;v<=max;v+=step) g+=`<line x1="${L}" x2="${L+w}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${(v/1e6).toFixed(0)} M</text>`;
  groups.forEach((gl,gi)=>{ const x0=L+gi*gw+gw*0.14;
    series.forEach((s,si)=>{ const v=s.vals[gi]||0, x=x0+si*bw;
      g+=`<rect x="${x}" y="${y(Math.max(0,v))}" width="${bw-3}" height="${Math.max(0,T0+h-y(Math.max(0,v)))}" rx="2" fill="${s.col}" ${s.op?`fill-opacity="${s.op}"`:''}/>`;
      g+=`<text x="${x+(bw-3)/2}" y="${y(Math.max(0,v))-4}" text-anchor="middle" style="fill:var(--ink);font-size:10px">${(v/1e6).toFixed(1)}</text>`; });
    g+=`<text x="${L+gi*gw+gw/2}" y="${H-20}" text-anchor="middle" style="fill:var(--ink);font-weight:600">${gl}</text>`;
    if(opts.under) g+=`<text x="${L+gi*gw+gw/2}" y="${H-6}" text-anchor="middle">${opts.under[gi]}</text>`; });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.aria||'')}">${g}</svg>`;
}
function linesYears(seriesByYear, opts={}){ // {year:[12 vals 0..1 or null]}
  const W=760,H=320,L=44,R=70,T0=14,B=34,w=W-L-R,h=H-T0-B; const x=i=>L+i*w/11, y=v=>T0+h-Math.min(1.05,Math.max(0,v))/1.05*h;
  let g='';
  for(let p=0;p<=100;p+=20) g+=`<line x1="${L}" x2="${L+w}" y1="${y(p/100)}" y2="${y(p/100)}" stroke="var(--line)"/><text x="${L-8}" y="${y(p/100)+4}" text-anchor="end">${p}%</text>`;
  MESES.forEach((m,i)=>g+=`<text x="${x(i)}" y="${H-12}" text-anchor="middle">${m}</text>`);
  if(opts.marker!=null) g+=`<line x1="${x(opts.marker)}" x2="${x(opts.marker)}" y1="${T0}" y2="${T0+h}" stroke="var(--muted)" stroke-dasharray="3 4"/><text x="${x(opts.marker)+4}" y="${T0+10}">fin de ${MESES[opts.marker].toLowerCase()}</text>`;
  for(const [yy,vals] of Object.entries(seriesByYear)){ const pts_=vals.map((v,i)=>v==null?null:[x(i),y(v)]).filter(Boolean); if(!pts_.length) continue;
    const c=YCOL[yy]; g+=`<polyline points="${pts_.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${c}" stroke-width="${+yy===CUR?3:2}" ${+yy===CUR?'':'stroke-opacity=".9"'}/>`;
    const lp=pts_[pts_.length-1]; const lv=vals.filter(v=>v!=null).slice(-1)[0];
    g+=`<circle cx="${lp[0]}" cy="${lp[1]}" r="3.5" fill="${c}"/><text x="${lp[0]+6}" y="${lp[1]+4}" style="fill:${c};font-weight:600">${yy} ${(lv*100).toFixed(1)}%</text>`; }
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.aria||'')}">${g}</svg>`;
}

  const ejC=CLOSED.map(y=>ratio(tv(y)[DEV],tv(y)[PIM])), ejAvg=avg(ejC);
  const saldoC=CLOSED.map(y=>tv(y)[PIM]-tv(y)[DEV]), saldoAvg=avg(saldoC);
  // acumulado hasta fin del último mes completo del año en curso
  const mBase=mesCorte-1; // índice del último mes completo
  const accTo=(y,m)=>T[y].dm.slice(0,m+1).reduce((a,b)=>a+b,0);
  // Escenarios: sin operaciones oficiales de crédito (rubro 19), cuyo devengado sigue el cronograma de la obra financiada;
  // a cada escenario se suma el devengado de ese rubro ya registrado al corte (credDev). Sin rubro 19, es el método de siempre.
  const CRED='19', X={}; YEARS.forEach(y=>{X[y]=agg(y,null,r=>r[2]!==CRED).get('*')||{v:[0,0,0,0,0,0,0],dm:new Array(12).fill(0)};});
  let credDev=tv(CUR)[DEV]-X[CUR].v[DEV]; if(Math.abs(credDev)<Math.max(1,0.005*tv(CUR)[PIM])){ credDev=0;  /* menos de 0.5 % del PIM: no se separa */ YEARS.forEach(y=>X[y]=T[y]); } // sin devengado de crédito en el año: método de siempre
  const accX=(y,m)=>X[y].dm.slice(0,m+1).reduce((a,b)=>a+b,0), pimX=X[CUR].v[PIM];
  const factor=CLOSED.map(y=>ratio(X[y].v[DEV], accX(y,mBase))).filter(x=>x>0&&isFinite(x));
  const baseCur=accX(CUR,mBase), pimCur=tv(CUR)[PIM];
  const projHist=factor.map(f=>Math.min(pimX,baseCur*f)+credDev);
  const projAvg=Math.min(pimX,baseCur*avg(factor))+credDev /* promedio de factores y luego tope en el PIM, igual que el reporte anual */, projMin=Math.min(...projHist), projMax=Math.max(...projHist);
  const compl=T[CUR].dm.slice(0,mesCorte); const ritmo=avg(compl), ritmo3=avg(compl.slice(-3));

  const projSh=Math.min(pimX, baseCur+avg(novdicSh)*pimX)+credDev;

    finMes:Object.fromEntries(YEARS.map(y=>[y, ratio(accTo(y,mBase), tv(y)[PIM])])),

  // curvas acumuladas
  const curves={}; YEARS.forEach(y=>{ let s=0; curves[y]=MESES.map((_,i)=>{ if(y===CUR&&i>=mesCorte) return null; s+=T[y].dm[i]; return ratio(s,tv(y)[PIM]); }); });

}

function renderFinanciamiento(){
  const el=$('#view-financiamiento');
  const rubros=new Map(); YEARS.forEach(y=>agg(y,'rubro').forEach(a=>{ if(!rubros.has(a.k)) rubros.set(a.k,a.l); }));
  const RK=[...rubros.keys()].sort();
  const RY={}; YEARS.forEach(y=>RY[y]=agg(y,'rubro'));
  const RCOL={'00':'var(--navy)','07':'var(--slate)','08':'var(--green)','09':'var(--amber)','18':'var(--gold)','19':'var(--red)','13':'var(--muted)'};
  const v=(y,k,i)=> (RY[y].get(k)||{v:[0,0,0,0,0,0,0]}).v[i];
  // saldo de balance: clasificador de ingreso 1.9.1.1.1.1 «Saldos de balance», tal como lo reporta el MEF (sin fórmulas)
  const CL_SB='1.9.1.1.1.1';
  const MS=x=>Math.abs(x)>=1e5?M1(x):'S/ '+Math.round(x).toLocaleString('en-US');   // montos chicos en soles, no «0.0 M»
  const SB={}; YEARS.forEach(y=>SB[y]=aggI(y,r=>r[1],r=>r[2]===CL_SB));
  const sbTot=y=>[...SB[y].values()].reduce((a,b)=>({pia:a.pia+b.pia,pim:a.pim+b.pim,rec:a.rec+b.rec}),{pia:0,pim:0,rec:0});
  // no ejecutado del año, por rubro
  const noEj=(y,filt)=>RK.filter(filt).reduce((s,k)=>s+v(y,k,PIM)-v(y,k,DEV),0);
  const recR=(y,k)=>(aggI(y,r=>r[1]).get(k)||{rec:0}).rec;               // ingreso recaudado del rubro (incluye su saldo de balance)
  const rubrosNoRO=y=>[...new Set([...RK, ...(I[y]?[...aggI(y,r=>r[1]).keys()]:[])])].filter(k=>k!=='00');
  const generado=y=>rubrosNoRO(y).reduce((s,k)=>s+recR(y,k)-v(y,k,DEV),0);  // caja que queda: recaudado − devengado
  const destino=y=>({ro:v(y,'00',PIM)-v(y,'00',DEV), noLlego:rubrosNoRO(y).reduce((s,k)=>s+v(y,k,PIM)-recR(y,k),0), caja:generado(y), total:T[y].v[PIM]-T[y].v[DEV]});
  // deuda
  const d19=YEARS.map(y=>{ const nuevo=aggI(y,r=>r[1],r=>r[1]==='19'&&r[2].startsWith('1.8')).get('19')||{pim:0,rec:0}; const saldo=aggI(y,r=>r[1],r=>r[1]==='19'&&r[2]===CL_SB).get('19')||{pim:0,rec:0};
    return {y,pim:v(y,'19',PIM),cer:v(y,'19',CER),dev:v(y,'19',DEV),nPim:nuevo.pim,nRec:nuevo.rec,sPim:saldo.pim,sRec:saldo.rec}; });
  const totN=d19.reduce((a,d)=>a+d.nPim,0), totNR=d19.reduce((a,d)=>a+d.nRec,0), totDev19=d19.reduce((a,d)=>a+d.dev,0);
  const proy19=new Map(); YEARS.forEach(y=>agg(y,'prod',r=>r[2]==='19').forEach(a=>{ const o=proy19.get(a.k)||{k:a.k,l:a.l,y:{}}; o.y[y]=a.v; proy19.set(a.k,o); }));
  // recaudación propia
  const prop=YEARS.map(y=>{ const m=aggI(y,r=>r[1],r=>!r[2].startsWith('1.9')); const g=k=>m.get(k)||{pia:0,pim:0,rec:0}; return {y,imp:g('08'),rdr:g('09')}; });

  el.innerHTML=`
  <section class="card"><h2>¿Con qué se financia el gasto cada año?</h2><p class="sub">PIM y devengado por rubro de financiamiento. La ejecución por rubro muestra qué fuentes se dejan de gastar.</p>

  <section class="card"><h2>¿Cuántos recursos adicionales se obtuvieron por endeudamiento?</h2>

    ${d19.map(d=>`<tr class="${d.y===CUR?'cur':''}"><td><b>${ylab(d.y)}</b></td>${hasI?`<td class="r num bl">${d.nPim?M1(d.nPim):'—'}</td><td class="r num">${d.nPim||d.nRec?M1(d.nRec):'—'}</td><td class="r num bl">${d.sPim?M1(d.sPim):'—'}</td><td class="r num" style="${d.sPim-d.sRec>50000?'color:var(--red);font-weight:700':''}">${d.sPim||d.sRec?M1(d.sRec):'—'}</td>`:''}<td class="r num bl">${d.pim?M1(d.pim):'—'}</td><td class="r num">${d.pim?M1(d.cer):'—'}</td><td class="r num">${d.pim||d.dev?M1(d.dev):'—'}</td><td class="r num">${d.pim?P1(ratio(d.dev,d.pim)):'—'}</td></tr>`).join('')}

let gDim='gen';
function matrix(dim){
  const keys=new Map(); const A={}; YEARS.forEach(y=>{A[y]=agg(y,dim); A[y].forEach(a=>{ if(!keys.has(a.k)) keys.set(a.k,{l:a.l,s:0}); keys.get(a.k).s+=a.v[PIM]; });});
  return {keys:[...keys.entries()].sort((a,b)=>b[1].s-a[1].s), A};
}
function renderGasto(){
  const el=$('#view-gasto'); const {keys,A}=matrix(gDim);
  const funnel=YEARS.map(y=>{const v=T[y].v;return {y,c:ratio(v[CER],v[PIM]),ca:ratio(v[CA],v[PIM]),d:ratio(v[DEV],v[PIM]),g:ratio(v[GIR],v[PIM])};});
  el.innerHTML=`<section class="card"><h2>¿En qué se gasta y qué se ejecuta peor?</h2><p class="sub">PIM y ejecución (devengado ÷ PIM) por año. En rojo, ejecución menor a 60 %.</p>
   <div class="toggle" role="group" aria-label="Agrupar por">${[['gen','Genérica'],['fun','Función'],['prog','Programa presupuestal'],['fuente','Fuente']].map(([k,t])=>`<button type="button" data-k="${k}" aria-pressed="${k===gDim}">${t}</button>`).join('')}</div>
   <div class="tbl-wrap"><table><thead><tr><th rowspan="2">${DIM[gDim].n}</th>${YEARS.map(y=>`<th class="grp" colspan="2">${ylab(y)}</th>`).join('')}<th rowspan="2" class="r">Tendencia de ejecución</th></tr><tr>${YEARS.map(()=>`<th class="r">PIM</th><th class="r">Ejec.</th>`).join('')}</tr></thead><tbody>
    ${keys.map(([k,o])=>{ const ej=YEARS.map(y=>{const a=A[y].get(k);return a&&a.v[PIM]?ratio(a.v[DEV],a.v[PIM]):null;});
      const spark=(()=>{const w=90,h=22; const pts_=ej.map((e,i)=>e==null?null:[4+i*(w-8)/(YEARS.length-1), h-2-Math.min(1,e)*(h-4)]).filter(Boolean); return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${pts_.map(p=>p.join(',')).join(' ')}" fill="none" stroke="var(--navy)" stroke-width="1.5"/>${pts_.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="2" fill="var(--navy)"/>`).join('')}</svg>`;})();
      return `<tr class="${k==='2.6'?'hl':''}"><td>${gDim==='gen'||gDim==='fun'?k+' · ':''}${esc(title(o.l))}</td>${YEARS.map((y,i)=>{const a=A[y].get(k); return `<td class="heat bl">${a&&a.v[PIM]?M1(a.v[PIM]):'—'}</td><td class="heat" style="${ej[i]!=null&&ej[i]<0.6?'color:var(--red);font-weight:600':''}">${ej[i]==null?'—':P1(ej[i])}</td>`;}).join('')}<td class="r">${spark}</td></tr>`;}).join('')}
   </tbody></table></div><p class="sub" style="margin-top:8px;font-size:12px">${CUR}* parcial al ${fechaTxt}.</p></section>
  <section class="card"><h2>¿En qué etapa se frena el gasto cada año?</h2><p class="sub">Embudo del gasto como % del PIM. La distancia entre certificado y devengado es el gasto que se reservó pero no se concretó.</p>
   <div class="tbl-wrap"><table><thead><tr><th>Año</th><th class="r">Certificado</th><th class="r">Comp. anual</th><th class="r">Devengado</th><th class="r">Girado</th><th class="r">Certificado sin devengar</th></tr></thead><tbody>
   ${funnel.map(f=>`<tr class="${f.y===CUR?'cur':''}"><td><b>${ylab(f.y)}</b></td><td class="r num">${P1(f.c)}</td><td class="r num">${P1(f.ca)}</td><td class="r num"><b>${P1(f.d)}</b></td><td class="r num">${P1(f.g)}</td><td class="r num" style="color:var(--red)">${M1(T[f.y].v[CER]-T[f.y].v[DEV])} (${(100*(f.c-f.d)).toFixed(1)} pts)</td></tr>`).join('')}
   </tbody></table></div></section>`;
  el.querySelectorAll('.toggle button').forEach(b=>b.onclick=()=>{gDim=b.dataset.k;renderGasto();});
}

   ${groupedBars(YEARS.map(ylab),[{n:'PIM',col:'var(--navy)',vals:byY.map(b=>b.v[PIM])},{n:'Dev',col:'var(--gold)',vals:byY.map(b=>b.v[DEV])}],{under:byY.map(b=>`${b.n} proyectos · ${P1(ratio(b.v[DEV],b.v[PIM]))}`),aria:'Inversión por año'})}
   <div class="tbl-wrap"><table><thead><tr><th>Año</th><th class="r">Proyectos</th><th class="r">PIM</th><th class="r">Devengado</th><th class="r">Ejecución</th><th class="r">Saldo no devengado</th><th class="r">Peso en el PIM total</th></tr></thead><tbody>

   </tbody></table></div></section>
  <section class="card"><h2>Proyectos que arrastran saldo año tras año</h2><p class="sub">${arr.length} proyectos aparecen en varios años con ejecución menor al 50 % en al menos un año cerrado: el presupuesto se reprograma pero la obra no avanza al mismo ritmo.</p>

    ${arr.slice(0,15).map(p=>`<tr><td><b>${esc(title(p.l))}</b><div class="mono sub" style="margin:0;font-size:11px">CUI ${p.k}</div></td>${YEARS.map(y=>{const v=p.y[y];return `<td class="r num bl">${v?`${M1(v[PIM])}<br><span style="${ratio(v[DEV],v[PIM])<0.5?'color:var(--red);font-weight:600':''}">${P1(ratio(v[DEV],v[PIM]))}</span>`:'—'}</td>`;}).join('')}<td class="r num">${M1(p.spim)}</td><td class="r num">${M1(p.sdev)}</td></tr>`).join('')}
   </tbody></table></div><p class="sub" style="margin-top:8px;font-size:12px">El PIM acumulado suma el presupuesto de cada año; no es el costo del proyecto (un mismo saldo puede reaparecer en varios años).</p></section>
  <section class="card"><h2>Todos los proyectos</h2><input type="search" id="inv-q" placeholder="Buscar proyecto o CUI…" value="${esc(invQ)}" aria-label="Buscar proyecto">
   <div class="tbl-wrap"><table><thead><tr><th>Proyecto</th>${YEARS.map(y=>`<th class="r">${ylab(y)}<br>PIM / ejec.</th>`).join('')}<th class="r">Devengado acumulado</th></tr></thead><tbody>
    ${shown.map(p=>`<tr><td>${esc(title(p.l))}<div class="mono sub" style="margin:0;font-size:11px">CUI ${p.k}</div></td>${YEARS.map(y=>{const v=p.y[y];return `<td class="r num bl">${v?`${M1(v[PIM])}<br><span class="sub">${P1(ratio(v[DEV],v[PIM]))}</span>`:'—'}</td>`;}).join('')}<td class="r num">${M1(p.sdev)}</td></tr>`).join('')}
   </tbody></table></div><p class="sub" style="margin-top:8px;font-size:12px">Se muestran hasta 30 proyectos ordenados por PIM acumulado; use el buscador para encontrar otros.</p></section>`;
  const q=$('#inv-q'); q.oninput=e=>{invQ=e.target.value; const pos=e.target.selectionStart; renderInversiones(); const i=$('#inv-q'); i.focus(); i.setSelectionRange(pos,pos);};
}

const VIEWS={evolucion:renderEvolucion,financiamiento:renderFinanciamiento,gasto:renderGasto,inversiones:renderInversiones}; const done={};
function show(){ const v=(location.hash||'#evolucion').slice(1), key=VIEWS[v]?v:'evolucion';
  for(const k in VIEWS) $('#view-'+k).hidden=k!==key;
  document.querySelectorAll('nav.tabs a').forEach(a=>a.setAttribute('aria-current',a.getAttribute('href')==='#'+key?'page':'false'));
  if(!done[key]){VIEWS[key]();done[key]=1;} }
window.addEventListener('hashchange',show); show();
})();
</script>
</body></html>
